name: Build Catalyst APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the project and add offline libraries
        run: |
          unzip -q -o "$(ls *.zip | head -n 1)" -d unzipped
          W=unzipped/catalyst-android/app/src/main/assets/www
          curl -fsSL -o $W/pdf-lib.min.js https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js || true
          mkdir -p $W/fb
          for n in app auth firestore; do curl -fsSL -o $W/fb/firebase-$n-compat.js https://www.gstatic.com/firebasejs/10.12.2/firebase-$n-compat.js || true; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare the private signing key
        env:
          KS: ${{ secrets.CATALYST_KEYSTORE_B64 }}
          PW: ${{ secrets.CATALYST_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then echo "::error::Add the CATALYST_KEYSTORE_B64 and CATALYST_PASSWORD secrets in Settings > Secrets and variables > Actions"; exit 1; fi
          echo "$KS" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/catalyst-release.jks"
      - name: Build the release APK and Play Store bundle
        working-directory: unzipped/catalyst-android
        env:
          CATALYST_KEYSTORE: ${{ runner.temp }}/catalyst-release.jks
          CATALYST_PASSWORD: ${{ secrets.CATALYST_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/Catalyst.apk
          cp app/build/outputs/bundle/release/app-release.aab ../out/Catalyst-PlayStore.aab
          rm -f "$CATALYST_KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: Catalyst-release
          path: unzipped/out/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: unzipped/catalyst-android/app/src/main/assets/www
  website:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
